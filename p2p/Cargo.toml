[package]
name = "karyon_p2p"
description = "A lightweight, extensible, and customizable p2p network stack."
version = "1.7.0"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["p2p", "networking", "peer-to-peer", "decentralized"]
categories = ["network-programming", "asynchronous"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tokio", "quic", "aws-lc-rs"]
smol = ["karyon_core/smol", "karyon_net/smol", "futures-rustls"]
tokio = ["karyon_core/tokio", "karyon_net/tokio", "tokio-rustls"]
serde = ["dep:serde", "karyon_net/serde"]
quic = ["karyon_net/quic"]
# rustls crypto provider for TLS and QUIC. Enable one; aws-lc-rs wins if
# both are on.
aws-lc-rs = [
    "karyon_net/aws-lc-rs",
    "futures-rustls?/aws-lc-rs",
    "tokio-rustls?/aws-lc-rs",
    "rcgen/aws_lc_rs",
]
ring = ["karyon_net/ring", "futures-rustls?/ring", "tokio-rustls?/ring", "rcgen/ring"]

[dependencies]
karyon_core = { workspace = true, features = ["crypto"] }
karyon_net = { workspace = true, features = ["tcp", "tls", "udp"] }
karyon_eventemitter = { workspace = true, features = ["derive"] }


log = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }

# encode/decode
bincode = { workspace = true, features = ["derive"] }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

# async
async-trait = { workspace = true }
async-channel = { workspace = true }

# tls
rcgen = { workspace = true, default-features = false, features = ["crypto"] }
yasna = { workspace = true }
x509-parser = { workspace = true }
futures-rustls = { workspace = true, features = ["logging", "tls12"], optional = true }
tokio-rustls = { workspace = true, features = ["logging", "tls12"], optional = true }
rustls-pki-types = { workspace = true }

[dev-dependencies]
karyon_core = { workspace = true, features = ["crypto", "testing"] }
karyon_net = { workspace = true, features = ["tcp", "tls", "udp", "quic"] }
smol = { workspace = true }
tokio = { workspace = true, features = ["full"] }
env_logger = "0.11"
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
