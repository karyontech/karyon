[package]
name = "karyon_stun"
description = "Minimal async STUN (RFC 5389) server and client over UDP, TCP, TLS and QUIC (karyon extension), built on karyon_net."
version = "0.1.3"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["stun", "nat", "quic", "networking", "karyon"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["tokio", "udp", "tcp", "tls", "quic"]
udp = ["karyon_net/udp"]
tcp = ["karyon_net/tcp"]
tls = ["tcp", "karyon_net/tls"]
quic = ["karyon_net/quic"]
smol = ["karyon_core/smol", "karyon_net/smol"]
tokio = ["karyon_core/tokio", "karyon_net/tokio"]

[dependencies]
karyon_core = { workspace = true }
karyon_net = { workspace = true }

log = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
karyon_core = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
