name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make check

  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt
      - run: make fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: make clippy

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make unit-test

  test-core:
    name: Integration Tests (core)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-core

  test-wasi:
    name: Integration Tests (wasm32-wasip2)
    runs-on: ubuntu-latest
    needs: check
    env:
      CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup target add wasm32-wasip2
      # A pinned release: the install script looks up "latest" and can fail
      # without failing the step.
      - name: Install wasmtime
        env:
          WASMTIME: wasmtime-v50.0.3-x86_64-linux
        run: |
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.3/$WASMTIME.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/$WASMTIME" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: >
          cargo test -p karyon_core --test user_runtime --target wasm32-wasip2
          --no-default-features --features tokio
      - run: >
          cargo test -p karyon_net --test custom_transport --target wasm32-wasip2
          --no-default-features --features tokio,framing
      - run: >
          cargo run -p karyon_net --example custom_transport --target wasm32-wasip2
          --no-default-features --features tokio,framing
      - run: >
          cargo run -p karyon_jsonrpc --example custom_runtime --target wasm32-wasip2
          --no-default-features --features tokio
      - run: >
          cargo test -p karyon_p2p --test mem_transport --target wasm32-wasip2
          --no-default-features --features tokio,ring
      - run: >
          cargo run -p karyon_p2p --example custom_runtime --target wasm32-wasip2
          --no-default-features --features tokio,ring
      - run: >
          cargo clippy -p karyon_kademlia -p karyon_swarm --target wasm32-wasip2
          --no-default-features --features tokio,ring -- -D warnings

  test-net:
    name: Integration Tests (net)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-net

  test-jsonrpc:
    name: Integration Tests (jsonrpc)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-jsonrpc

  test-p2p:
    name: Integration Tests (p2p)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-p2p

  test-kademlia:
    name: Integration Tests (kademlia)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-kademlia

  test-swarm:
    name: Integration Tests (swarm)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-swarm

  test-stun:
    name: Integration Tests (stun)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-stun

  test-eventemitter:
    name: Integration Tests (eventemitter)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: make test-eventemitter
