[package]
name = "karyon_swarm"
description = "Protocol-aware peer groups (swarms) for karyon_p2p in Rust: join swarms by protocol, discover peers per swarm, and broadcast to them."
version = "2.0.3"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["p2p", "swarm", "peer-to-peer", "peer-groups", "broadcast"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["tokio", "aws-lc-rs"]
smol = ["karyon_p2p/smol", "karyon_core/smol"]
tokio = ["karyon_p2p/tokio", "karyon_core/tokio"]
# Default rustls crypto provider, passed to karyon_p2p. Optional.
aws-lc-rs = ["karyon_p2p/aws-lc-rs"]
ring = ["karyon_p2p/ring"]

[dependencies]
karyon_p2p = { workspace = true }
karyon_core = { workspace = true }

bincode = { workspace = true, features = ["derive"] }
log = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
karyon_core = { workspace = true, features = ["testing"] }
karyon_kademlia = { workspace = true }
async-trait = { workspace = true }
smol = { workspace = true }
tokio = { workspace = true, features = ["full"] }
