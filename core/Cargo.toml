[package]
name = "karyon_core"
description = "Runtime-agnostic async utilities (smol/tokio) for the karyon crates: executors, task groups, queues, timeouts, and optional Ed25519 crypto."
version = "2.0.1"
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
keywords = ["async", "utilities", "smol", "tokio", "karyon"]
categories = ["asynchronous"]

[features]
default = ["tokio"]
crypto = ["ed25519-dalek"]
testing = ["easy-parallel", "async-channel", "env_logger"]
tokio = ["dep:tokio"]
smol = ["dep:smol", "async-process", "dep:log"]

[dependencies]
thiserror = { workspace = true }
log = { workspace = true, optional = true }
rand = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
async-task = { workspace = true }

pin-project-lite = { workspace = true }
async-process = { workspace = true, optional = true }
smol = { workspace = true, optional = true }

ed25519-dalek = { workspace = true, features = ["rand_core"], optional = true }

# testing
easy-parallel = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

# Only what core uses: locks, IO traits, the runtime, timers and sockets.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = [
    "sync",
    "io-util",
    "rt",
    "rt-multi-thread",
    "time",
    "net",
], optional = true }

# wasm has no threads or sockets. Tasks and timers come from a user runtime
# (`Executor::from(runtime)`), sockets from the user's transport.
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { workspace = true, features = ["sync", "io-util", "rt", "time"], optional = true }
